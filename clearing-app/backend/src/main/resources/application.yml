spring:
  application:
    name: internal-clearing
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/clearing}
    username: ${DB_USER:clearing}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.batch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.treasury.clearing: INFO
